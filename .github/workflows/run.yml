name: Finance Calendar Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test API
        run: |
          python - <<'PY'
          import requests

          url = "https://www.financecalendar.com/wp-json/fc/v1/today"

          r = requests.get(url, timeout=30)

          print("STATUS:", r.status_code)
          print("LENGTH:", len(r.text))
          print(r.text[:3000])
          PY
